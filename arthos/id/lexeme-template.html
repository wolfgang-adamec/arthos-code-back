<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexem: {{value}} ({{lang}})</title>
  <link rel="stylesheet" href="../card-style.css">
</head>

<body>
  <div class="profile-card">
    <!-- Header -->
    <div class="profile-header">
      <span class="public-id">Public ID: {{public_id}}</span>
      <h1>{{value}}</h1>
      <span class="domain-badge">Detail: {{value_detail}}</span>
    </div>

    <!-- Body -->
    <div class="profile-body">           
      <!-- Kurz-Definition -->
      <div class="section-title">Kurz-Definition</div>
      <div class="legacy-box">
        <p class="legacy-text">{{definition_short}}</p>
      </div>

      <!-- Sprache -->
      <div class="section-title">Sprache</div>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Sprach-Code</span>
          <span class="info-value">{{lang}}</span>
        </div>
        <div class="info-item">
          <span class="info-label">Sprache</span>
          <span class="info-value">{{lang_full_name}}</span>
        </div>
      </div>

      <!-- Ueberbegriff -->
      <div class="section-title">Überbegriff</div>
      <div class="info-grid">	  
        <div class="info-item">
          <span class="info-label">Hypernym</span>
          <span class="info-value">{{hypernym}}</span>
        </div>
		<div class="info-item">
          <span class="info-label">.</span>
          <span class="info-value">.</span>
        </div>
      </div>

      <!-- Beispielssatz -->
      <div class="section-title">Beispielssatz</div>
      <div class="evidence-box">
        <p class="evidence-text">{{example_sentence}}</p>
      </div>

    </div>
  </div>

</body>
</html>
