<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexem: {{value}} ({{lang}})</title>
  <link rel="stylesheet" href="../card-style.css">
</head>

<body>
  <div class="profile-card">
    <!-- Header -->
    <div class="profile-header">
      <h1>{{value}}</h1>
      <div class="meta-row">                                                                                                                                      
        <span class="meta-domain">Detail: {{value_detail}}</span>                                                                                                         
		<span class="meta-id">ID: {{public_id}}</span>                                                                                                           
      </div>      
    </div>

    <!-- Body -->
    <div class="profile-body">           
      <!-- Definition -->
      <div class="section-title">Definition</div>
      <div class="info-value-4">
        {{definition_detail}}
      </div>

      <!-- Sprache -->
      <div class="section-title">Sprache</div>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Sprach-Code</span>
          <span class="info-value">{{lang}}</span>
        </div>
        <div class="info-item">
          <span class="info-label">Sprache</span>
          <span class="info-value">{{lang_full_name}}</span>
        </div>
      </div>

      <!-- Ueberbegriff -->
      <div class="section-title">Überbegriff</div>
      <div class="info-value">	  
         {{hypernym}}
      </div>
      
      <div class="section-title">Ähnliche Begriffe in anderen Sprachen</div>
      <div class="info-value-4">	  
         {{similar_lexemes}}
      </div>

      <!-- Beispielssatz -->
      <div class="section-title">Referenz-Satz</div>
      <div class="info-value-4">	  
         {{reference_sentence}}
      </div>

    </div>
  </div>

</body>
</html>
